<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-IT Academy - Tech Education in Myanmar</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
     <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100" style="max-width: 900px;">
        <div class="row g-0">
            <div class="col-lg-6 d-none d-lg-block bg-primary position-relative overflow-hidden">
                <img src="image/category_networking.jpg" alt="Illustration" class="w-100 h-100 object-fit-cover">
            </div>

            <div class="col-lg-6 bg-warning p-4 p-sm-5 d-flex flex-column justify-content-center custom-yellow-bg">
                
                <!-- Brand Logo Section -->
                

                <h4 class="fw-semibold text-dark text-center mb-4">Login</h4>

                <form>
                    <div class="input-group mb-3 custom-input-group">
                        <span class="input-group-text bg-white border-0 ps-3 pe-2 text-muted">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control border-0 py-2 fs-6 shadow-none" placeholder="Username/Email" required>
                    </div>

                    <div class="input-group mb-3 custom-input-group">
                        <span class="input-group-text bg-white border-0 ps-3 pe-2 text-muted">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                        <input type="password" class="form-control border-0 py-2 fs-6 shadow-none" placeholder="Password" required>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4 small fw-medium">
                        <div class="form-check">
                            <input class="form-check-input shadow-none" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-dark" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-dark text-decoration-none">Forget password?</a>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 rounded-pill fw-semibold btn-login shadow-sm">
                        Login
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-dark mb-2">or sign up using</p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="#" class="social-icon bg-white text-primary rounded-circle d-flex align-items-center justify-content-center shadow-sm">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social-icon bg-white text-info rounded-circle d-flex align-items-center justify-content-center shadow-sm">
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
