
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Micro-IT Academy | Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">


   

</head>

<body>

    <!-- ==============================
         LOGIN SECTION
    ============================== -->

    <section class="login-container d-flex align-items-center justify-content-center py-4">

        <div class="container">

            <div class="card login-card overflow-hidden mx-auto">

                <div class="row g-0 h-100">

                    <!-- LEFT IMAGE -->
                    <div class="col-lg-6 d-none d-lg-block login-image">

                        <img src="image/category_networking.jpg"
                            alt="Micro-IT Academy Training">

                    </div>


                    <!-- RIGHT LOGIN FORM -->
                    <div class="col-lg-6 login-form-section position-relative d-flex flex-column justify-content-center">

                        <!-- CLOSE BUTTON -->
                        <a href="index.html"
                            class="close-btn"
                            title="Back to Home"
                            aria-label="Back to Home">

                            <i class="fa-solid fa-xmark"></i>

                        </a>


                        <!-- LOGIN HEADING -->
                        <div class="text-center mb-4">

                            <h2 class="login-title mb-0">
                                Login
                            </h2>

                            <div class="title-line"></div>

                        </div>


                        <!-- LOGIN FORM -->
                        <form action="#" method="POST">

                            <!-- USERNAME / EMAIL -->
                            <div class="position-relative mb-3">

                                <i class="fa-solid fa-user input-icon"></i>

                                <input type="text"
                                    class="form-control login-input"
                                    name="username"
                                    placeholder="Username/Email"
                                    autocomplete="username"
                                    required>

                            </div>


                            <!-- PASSWORD -->
                            <div class="position-relative mb-3">

                                <i class="fa-solid fa-lock input-icon"></i>

                                <input type="password"
                                    class="form-control login-input"
                                    id="password"
                                    name="password"
                                    placeholder="Password"
                                    autocomplete="current-password"
                                    required>

                                <button type="button"
                                    class="password-toggle"
                                    id="togglePassword"
                                    aria-label="Show password">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>


                            <!-- REMEMBER ME & FORGOT PASSWORD -->
                            <div class="d-flex align-items-center justify-content-between mb-4 small">

                                <div class="form-check">

                                    <input class="form-check-input shadow-none"
                                        type="checkbox"
                                        id="rememberMe"
                                        name="remember">

                                    <label class="form-check-label text-dark"
                                        for="rememberMe">

                                        Remember me

                                    </label>

                                </div>

                                <a href="#"
                                    class="forgot-link fw-semibold">

                                    Forgot password?

                                </a>

                            </div>


                            <!-- LOGIN BUTTON -->
                            <button type="submit"
                                class="btn btn-login w-100">

                                Login

                            </button>

                        </form>


                        <!-- SOCIAL LOGIN -->
                        <div class="text-center mt-4">

                            <p class="small text-dark mb-3">

                                or sign up using

                            </p>

                            <div class="d-flex justify-content-center gap-2">

                                <!-- FACEBOOK -->
                                <a href="#"
                                    class="social-icon"
                                    aria-label="Facebook">

                                    <i class="fa-brands fa-facebook-f"></i>

                                </a>

                                <!-- TWITTER -->
                                <a href="#"
                                    class="social-icon"
                                    aria-label="Twitter">

                                    <i class="fa-brands fa-twitter"></i>

                                </a>

                            </div>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ==============================
         BOOTSTRAP JS
    ============================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- SHOW / HIDE PASSWORD -->
    <script>

        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";

            this.innerHTML = isPassword
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';

            this.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );

        });

    </script>

</body>

</html>
